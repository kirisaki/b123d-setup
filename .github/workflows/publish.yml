name: Build and publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.10"
          enable-cache: false
      - name: Test CLI
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build distributions
        run: uv build --no-sources
      - name: Check package metadata and README
        run: uvx twine check --strict dist/*
      - name: Smoke test the wheel
        run: uvx --from dist/*.whl b123d-setup "$RUNNER_TEMP/cad-smoke" --with-vscode
      - name: Check generated CAD and viewer dependencies
        run: |
          uv run --directory "$RUNNER_TEMP/cad-smoke" --python 3.11 python -c "from ocp_vscode import show; from parts.base_plate import base_plate; assert callable(show); assert base_plate().is_valid"
          uv run --directory "$RUNNER_TEMP/cad-smoke" --python 3.11 -m scripts.export_all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/b123d-setup/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: false
      - name: Publish using Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
